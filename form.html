<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Daftar Akun</title>
</head>
<body>

    <!-- MINI MENU NAVIGASI (PURE HTML) -->
    <nav>
        <b>Navigasi:</b> 
        <a href="blog.html">Blog List</a> | 
        <a href="blog-detail.html">Blog Detail</a> | 
        <a href="cv.html">CV</a> | 
        <a href="form.html">Form</a> | 
        <a href="index.html">Film</a>
    </nav>
    <hr>

    <form action="" method="POST">
        <fieldset>
            <legend>Daftar Akun</legend>

            <!-- Nama Lengkap -->
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama">
            <hr>

            <!-- Jenis Kelamin -->
            <label>Jenis Kelamin:</label>
            <input type="radio" id="laki" name="gender" value="Laki-Laki">
            <label for="laki">Laki-Laki</label>
            <input type="radio" id="perempuan" name="gender" value="Perempuan">
            <label for="perempuan">Perempuan</label>
            <hr>

            <!-- Tempat Lahir -->
            <label for="tempat_lahir">Tempat Lahir:</label>
            <input type="text" id="tempat_lahir" name="tempat_lahir">
            <hr>

            <!-- Tanggal Lahir -->
            <label for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir">
            <hr>

            <!-- Agama -->
            <label for="agama">Agama:</label>
            <select id="agama" name="agama">
                <option value="">--- Pilih Agama ---</option>
                <option value="Islam">Islam</option>
                <option value="Katolik">Katolik</option>
                <option value="Protestan">Protestan</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
            </select>
            <hr>

            <!-- Hobi -->
            <label>Hobi:</label>
            <input type="checkbox" id="olahraga" name="hobi[]" value="Olahraga">
            <label for="olahraga">Olahraga</label>
            <input type="checkbox" id="membaca" name="hobi[]" value="Membaca">
            <label for="membaca">Membaca</label>
            <input type="checkbox" id="ngoding" name="hobi[]" value="Ngoding">
            <label for="ngoding">Ngoding</label>
            <hr>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <hr>

            <!-- Persetujuan -->
            <input type="checkbox" id="persetujuan" name="persetujuan" value="setuju">
            <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
            <hr>

            <!-- Tombol Aksi -->
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </fieldset>
    </form>

</body>
</html>
